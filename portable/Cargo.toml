[package]
name = "rec"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rec"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
fontdue = "0.9"
libc = "0.2"
portable-pty = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
signal-hook = "0.4"
vt100 = "0.16"
vte = "0.15"

[profile.release]
strip = true
